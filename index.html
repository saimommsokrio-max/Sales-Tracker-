<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokrio Sales Tracker — Pipeline &amp; Work Plan Manager</title>
  <meta name="description" content="Premium sales pipeline tracker for managing monthly work plans, tracking deals, and monitoring company outreach progress.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-title">Sokrio Tracker</div>
        <div class="logo-subtitle">Sales Pipeline Manager</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Nav items built by JS -->
      </nav>

      <!-- Sync & Share Tools -->
      <div class="sidebar-sync-tools">
        <div class="sidebar-section-title">SYNC &amp; PERSISTENCE</div>
        
        <!-- Live Cloud Sync Status Indicator -->
        <div class="sync-status-badge" id="sync-status-badge" onclick="openCloudModal()" title="Click to view Cloud & Database settings">
          <span class="sync-dot"></span>
          <span id="sync-status-text">Checking Sync...</span>
        </div>

        <button class="sync-btn sync-btn-cloud" onclick="openCloudModal()" title="Manage Persistent Cloud Database & Backup Settings">
          <span>☁️</span> Cloud Storage &amp; Sync
        </button>

        <button class="sync-btn sync-btn-share" onclick="copyShareableUrl()" title="Copy live URL with all current changes to open in any browser">
          <span>🔗</span> Copy Shareable Link
        </button>
        <button class="sync-btn" onclick="openExportCsvModal()" style="background:rgba(16,185,129,0.12);color:var(--accent-emerald);border-color:rgba(16,185,129,0.35);font-weight:600" title="Export all records and reports to CSV (Excel format)">
          <span>📊</span> Export CSV Reports
        </button>

        <div class="sync-btn-group">
          <button class="sync-btn" onclick="exportStateJson()" title="Download JSON backup file">
            <span>📥</span> Export
          </button>
          <button class="sync-btn" onclick="triggerImportJson()" title="Import JSON backup file">
            <span>📤</span> Import
          </button>
        </div>
        <input type="file" id="import-json-input" accept=".json" style="display:none" onchange="handleImportJson(event)">
        <button class="sync-btn sync-btn-reset" onclick="resetToDefaultData()" title="Reset to default July 2026 workplan">
          <span>🔄</span> Reset Default
        </button>
      </div>

      <div class="sidebar-footer">
        <span id="footer-text"></span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Global Sleek SaaS Topbar -->
      <header class="app-topbar" id="app-topbar">
        <div class="topbar-left">
          <div class="topbar-breadcrumbs" id="topbar-breadcrumbs">
            <span class="crumb-root">Sokrio Tracker</span>
            <span class="crumb-sep">/</span>
            <span class="crumb-category" id="crumb-category">Sales Pipeline</span>
            <span class="crumb-sep">/</span>
            <span class="crumb-current" id="crumb-current">Pipeline Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Live Date & Clock -->
          <div class="topbar-clock" id="topbar-clock" title="Current local time">
            <span class="clock-icon">🕒</span>
            <span id="live-time-str">Loading time...</span>
          </div>

          <!-- Quick Global Action Button -->
          <div class="topbar-quick-add" style="display:flex;gap:8px">
            <button class="btn-primary topbar-add-btn" onclick="openClientFollowupModal()" title="Record Client Follow-up Call">
              <span>➕</span> Record Call
            </button>
            <button class="btn-ghost" onclick="openExportCsvModal()" style="padding:6px 13px;border-radius:var(--radius-full);font-size:0.8rem;color:var(--accent-emerald);border-color:rgba(16,185,129,0.35);font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer" title="Download Reports as CSV (Excel)">
              <span>📥</span> CSV
            </button>
          </div>

          <!-- Smart Reminders Notification Bell -->
          <div class="topbar-reminder-wrap" id="topbar-reminder-wrap">
            <button class="topbar-reminder-btn" id="reminder-bell-btn" onclick="toggleReminderDropdown(event)" title="Smart Follow-up Reminders">
              <span class="bell-icon">🔔</span>
              <span class="reminder-count-badge" id="reminder-count-badge" style="display:none">0</span>
            </button>
            <div class="reminder-dropdown-panel" id="reminder-dropdown-panel">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Theme Toggle Switcher -->
          <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Switch between Dark and Light mode">
            <span class="theme-icon" id="theme-toggle-icon">🌙</span>
            <span class="theme-label" id="theme-toggle-label">Dark</span>
          </button>

          <!-- Active User Profile Indicator -->
          <div class="topbar-user" title="Active Team Member">
            <div class="user-avatar-initial">S</div>
            <div class="user-meta">
              <span class="user-name">Saimom</span>
              <span class="user-role">Account Lead</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dashboard View -->
      <div class="view" id="view-dashboard"></div>

      <!-- Existing Client Operations Views -->
      <div class="view" id="view-client-followup"></div>
      <div class="view" id="view-client-payments"></div>
      <div class="view" id="view-client-issues"></div>

      <!-- Pipeline Board View -->
      <div class="view" id="view-pipeline"></div>

      <!-- Call Log View -->
      <div class="view" id="view-monthly-plan"></div>

      <!-- Companies View -->
      <div class="view" id="view-companies"></div>

      <!-- Activity Log View -->
      <div class="view" id="view-activity-log"></div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-container"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js?v=20260906"></script>
</body>
</html>
