<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokrio Sales Tracker — Pipeline &amp; Work Plan Manager</title>
  <meta name="description" content="Premium sales pipeline tracker for managing monthly work plans, tracking deals, and monitoring company outreach progress.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-title">Sokrio Tracker</div>
        <div class="logo-subtitle">Sales Pipeline Manager</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Nav items built by JS -->
      </nav>

      <!-- Sync & Share Tools -->
      <div class="sidebar-sync-tools">
        <div class="sidebar-section-title">SYNC &amp; PERSISTENCE</div>
        
        <!-- Live Cloud Sync Status Indicator -->
        <div class="sync-status-badge" id="sync-status-badge" onclick="openCloudModal()" title="Click to view Cloud & Database settings">
          <span class="sync-dot"></span>
          <span id="sync-status-text">Checking Sync...</span>
        </div>

        <button class="sync-btn sync-btn-cloud" onclick="openCloudModal()" title="Manage Persistent Cloud Database & Backup Settings">
          <span>☁️</span> Cloud Storage &amp; Sync
        </button>

        <button class="sync-btn sync-btn-share" onclick="copyShareableUrl()" title="Copy live URL with all current changes to open in any browser">
          <span>🔗</span> Copy Shareable Link
        </button>
        <div class="sync-btn-group">
          <button class="sync-btn" onclick="exportStateJson()" title="Download JSON backup file">
            <span>📥</span> Export
          </button>
          <button class="sync-btn" onclick="triggerImportJson()" title="Import JSON backup file">
            <span>📤</span> Import
          </button>
        </div>
        <input type="file" id="import-json-input" accept=".json" style="display:none" onchange="handleImportJson(event)">
        <button class="sync-btn sync-btn-reset" onclick="resetToDefaultData()" title="Reset to default July 2026 workplan">
          <span>🔄</span> Reset Default
        </button>
      </div>

      <div class="sidebar-footer">
        <span id="footer-text"></span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Dashboard View -->
      <div class="view" id="view-dashboard"></div>

      <!-- Existing Client Follow-up View -->
      <div class="view" id="view-client-followup"></div>

      <!-- Pipeline Board View -->
      <div class="view" id="view-pipeline"></div>

      <!-- Call Log View -->
      <div class="view" id="view-monthly-plan"></div>

      <!-- Companies View -->
      <div class="view" id="view-companies"></div>

      <!-- Activity Log View -->
      <div class="view" id="view-activity-log"></div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-container"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
